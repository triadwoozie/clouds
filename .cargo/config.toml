# `cargo xtask …` runs the repository's task crate, so the commands in docs/perf-platform.md and
# web/perf/README.md work as written. `cargo run -p xtask -- …` stays equivalent.
[alias]
xtask = "run --package xtask --"

[target.wasm32-unknown-unknown]
rustflags = [
    "--cfg", "wasm_js",
    "--cfg", "getrandom_backend=\"wasm_js\"",
    "-C", "target-feature=+simd128",
    "-C", "link-arg=-zstack-size=16777216",
    "-C", "link-arg=--initial-memory=67108864",
    "-C", "link-arg=--max-memory=2147483648"
]
